global:
  resolve_timeout: 5m

route:
  receiver: webhook-retrain
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  - name: webhook-retrain
    webhook_configs:
      - url: "http://alert-webhook:8001/webhook/alert"
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            # Alertmanager does not expand ${ENV} in its config; the compose
            # entrypoint writes ALERT_WEBHOOK_TOKEN into this file at startup.
            credentials_file: /tmp/alert_token
