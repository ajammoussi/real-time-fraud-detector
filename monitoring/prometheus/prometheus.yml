global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "fraud-api"
    static_configs:
      - targets: ["fraud-api:8000"]
    metrics_path: /metrics

  - job_name: "lake-consumer"
    static_configs:
      - targets: ["lake-consumer:8002"]
    metrics_path: /metrics

  - job_name: "kafka-consumer"
    static_configs:
      - targets: ["kafka-consumer:9101"]
    metrics_path: /metrics

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
