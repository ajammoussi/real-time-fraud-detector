groups:
  - name: drift_alerts
    rules:
      - alert: FraudDriftHigh
        expr: evidently_drift_share > 0.15
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Model input drift detected (drifted share={{ $value }})"

      - alert: HighPredictionLatency
        # Observed p99 on this stack is ~160ms (first call includes a registry
        # refresh); 500ms is ~3x normal, so the rule stays quiet when healthy.
        expr: histogram_quantile(0.99, sum(rate(prediction_latency_seconds_bucket[5m])) by (le)) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 prediction latency > 500ms ({{ $value }}s)"

      - alert: NoPredictions
        # `or absent(...)` covers the case the rule exists for: the API is gone,
        # so the counter disappears and `sum(rate(...)) == 0` would silently
        # return no data instead of firing.
        expr: sum(rate(predictions_total[15m])) == 0 or absent(predictions_total)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No predictions served for 30m — API or traffic is down"

      - alert: LakeConsumerLagHigh
        expr: kafka_consumer_lag{job="lake-consumer"} > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lake consumer is more than 5000 messages behind ({{ $value }})"
