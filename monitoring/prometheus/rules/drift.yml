groups:
  - name: drift_alerts
    rules:
      - alert: FraudDriftHigh
        expr: evidently_drift_share > 0.15
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Model input drift detected (drifted share={{ $value }})"

      - alert: HighPredictionLatency
        expr: histogram_quantile(0.99, sum(rate(prediction_latency_seconds_bucket[5m])) by (le)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 prediction latency > 100ms"

      - alert: NoPredictions
        expr: sum(rate(predictions_total[15m])) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "No predictions served for 30m — API or traffic is down"

      - alert: LakeConsumerLagHigh
        expr: kafka_consumer_lag{job="lake-consumer"} > 5000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lake consumer is more than 5000 messages behind ({{ $value }})"
