[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-fraud-detector"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = [
    "api",
    "config",
    "db",
    "datalake",
    "features",
    "gx",
    "ingestion",
    "monitoring",
    "scripts",
    "training",
]

[tool.coverage.report]
omit = ["tests/*", "*/__init__.py"]
