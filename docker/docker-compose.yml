# Enable Docker BuildKit for better caching:
#   export DOCKER_BUILDKIT=1

name: real-time-fraud-detection

services:
  # ── Data Lake ──────────────────────────────────────────────────────────
  seaweedfs-master:
    image: chrislusf/seaweedfs:3.65
    command: master -ip=seaweedfs-master -port=9333
    ports: ["9333:9333"]

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.65
    command: volume -mserver=seaweedfs-master:9333 -port=8080 -dir=/data
    volumes: ["seaweedfs-data:/data"]
    ports: ["8080:8080"]
    depends_on: [seaweedfs-master]

  seaweedfs-filer:
    image: chrislusf/seaweedfs:3.65
    command: filer -master=seaweedfs-master:9333 -port=8888
    depends_on: [seaweedfs-master]
    ports: ["8888:8888"]

  seaweedfs-s3:
    image: chrislusf/seaweedfs:3.65
    command: s3 -port=8333 -ip.bind=0.0.0.0 -filer=seaweedfs-filer:8888
    ports: ["8333:8333"]
    depends_on: [seaweedfs-filer]

  # ── Storage ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mlops
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops_secret
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlops -d mlops"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # ── Kafka ──────────────────────────────────────────────────────────────
  # Two listeners: INTERNAL for containers (kafka:9092), EXTERNAL for host
  # clients such as a locally run producer (localhost:29092).
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment: {ZOOKEEPER_CLIENT_PORT: 2181}

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092", "29092:29092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ── MLflow ─────────────────────────────────────────────────────────────
  mlflow-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    env_file: [../.env]
    command: >
      sh -c "exec mlflow server
      --backend-store-uri $$MLFLOW_BACKEND_STORE_URI
      --default-artifact-root s3://datalake/models/
      --host 0.0.0.0 --port 5000"
    ports: ["5000:5000"]
    restart: always
    environment:
      # Explicit psycopg2 driver: a bare postgresql:// makes SQLAlchemy 2.0
      # pick psycopg (v3), which is not installed in the image.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlops:mlops_secret@postgres/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs-s3:8333
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1', 5000)); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── Ingestion: Binance WebSocket → Kafka producer ─────────────────────
  # Connects to wss://stream.binance.com:9443/stream (public, no auth).
  # Publishes one unlabelled JSON record per trade to `transactions_raw`.
  binance-producer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: python ingestion/producer.py
    env_file: [../.env]
    restart: always
    depends_on: [kafka]
    environment:
      BINANCE_WS_BASE: wss://stream.binance.com:9443/stream
      BINANCE_SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt

  # ── Ingestion: Kafka → SeaweedFS lake writer ───────────────────────────
  # Reads `transactions_raw`, batches messages, pre-checks them, and writes
  # Parquet to s3://datalake/raw/. Group `lake-writers`.
  lake-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: python ingestion/lake_consumer.py
    env_file: [../.env]
    restart: always
    ports: ["8002:8002"]
    depends_on:
      kafka:
        condition: service_started
      seaweedfs-s3:
        condition: service_started
    environment:
      LAKE_BATCH_SIZE: 1000
      LAKE_BATCH_TIMEOUT_SECS: 300

  # ── API + prediction consumer ──────────────────────────────────────────
  fraud-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports: ["8000:8000"]
    env_file: [../.env]
    # Read-only registry mount: the API reads the Feast registry but never writes it.
    volumes:
      - ../feature_repo:/app/feature_repo:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      mlflow-server:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started

  # Reads `transactions_raw` (group: prediction-workers) — independent offset
  # from lake-consumer. Scores each record and persists it to PostgreSQL.
  kafka-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: python ingestion/predict_consumer.py
    env_file: [../.env]
    restart: always
    ports: ["9101:9101"]
    volumes:
      - ../feature_repo:/app/feature_repo:ro
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      mlflow-server:
        condition: service_healthy

  # ── Monitoring ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ../monitoring/prometheus:/etc/prometheus
    ports: ["9090:9090"]

  # Batch jobs push `evidently_drift_share` here; Prometheus scrapes it.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports: ["9091:9091"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # Alertmanager has no --config.expand-env flag and does not expand ${VARS}
    # in its config, so the bearer token is materialised into a file the config
    # reads via credentials_file. (Verified against v0.27/v0.28/v0.29.)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$ALERT_WEBHOOK_TOKEN" > /tmp/alert_token
        && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ../monitoring/alertmanager:/etc/alertmanager
    env_file: [../.env]
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:10.4.2
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on: [prometheus]

  alert-webhook:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monitoring
    ports: ["8001:8001"]
    env_file: [../.env]

  # ── Batch job services (docker compose run --rm <name>) ───────────────
  # These are one-shot jobs, not long-running services: they live behind the
  # `jobs` profile so `up` never starts them.
  trainer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    profiles: ["jobs"]
    env_file: [../.env]
    # Bind the repo so `dvc repro` writes metrics.json / data/dataset.parquet
    # back to the working tree instead of into a discarded container layer.
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      mlflow-server:
        condition: service_healthy

  features:
    build:
      context: ..
      dockerfile: docker/Dockerfile.training
    profiles: ["jobs"]
    env_file: [../.env]
    volumes:
      - ../feature_repo:/app/feature_repo
    depends_on:
      seaweedfs-s3:
        condition: service_started
      redis:
        condition: service_started

  drift:
    build:
      context: ..
      dockerfile: docker/Dockerfile.monitoring
    profiles: ["jobs"]
    env_file: [../.env]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_started
      pushgateway:
        condition: service_started

  # ── Interactive demo (Gradio) ─────────────────────────────────────────
  gradio-demo:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gradio
    ports: ["7860:7860"]
    env_file: [../.env]
    environment:
      - FRAUD_API_URL=http://fraud-api:8000
    restart: unless-stopped

volumes:
  seaweedfs-data:
  pgdata:
  grafana-data:
